<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pocket.js</title>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="assets/favicon.png">
</head>

<body>

    <div class="bg-layer"></div>
    <div class="cartridge-slot"></div>
    <div class="theme-layer">
        <div class="desktop-layout" id="desktop">
            <div class="side-panel console-part">
                <div class="d-speaker">
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
                <div class="side-panel-input side-panel-input-left" id="desktop-input-left">
                    <!-- Dynamic Input Loaded Here -->
                </div>
                <div class="menu-pill">
                    <svg class="pill-bg" viewBox="0 0 305 131" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect width="305" height="131" rx="65.5" fill="var(--btn-container)" />
                    </svg>
                    <svg class="menu-pill-inner" viewBox="0 0 231 67" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect width="231" height="67" rx="33.5" fill="var(--btn-color)" />
                    </svg>
                </div>
                <div class="kb-panel kb-desktop-left" id="kb-desktop-left"></div>
            </div>
            <div class="separator-wrap console-part">
                <div class="sep-group">
                    <div class="sep-rect"></div>
                    <div class="sep-rect"></div>
                    <div class="sep-rect"></div>
                </div>
                <div class="separator"></div>
                <div class="sep-group">
                    <div class="sep-rect"></div>
                    <div class="sep-rect"></div>
                    <div class="sep-rect"></div>
                </div>
            </div>
            <div class="center-panel">
                <div class="panel-bg-layer"></div>
                <div id="shared-screen-container">
                    <div class="screen">
                        <div class="opened-app"></div>
                        <img src="assets/pocket.js.png" class="logo-img" alt="Pocket.js">
                        <div class="recording-indicator" id="rec-dot-desktop"></div>
                    </div>
                </div>
            </div>
            <div class="separator-wrap console-part">
                <div class="sep-group">
                    <div class="sep-rect"></div>
                    <div class="sep-rect"></div>
                    <div class="sep-rect"></div>
                </div>
                <div class="separator"></div>
                <div class="sep-group">
                    <div class="sep-rect"></div>
                    <div class="sep-rect"></div>
                    <div class="sep-rect"></div>
                </div>
            </div>
            <div class="side-panel console-part">
                <div class="d-speaker">
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
                <div class="side-panel-input side-panel-input-right" id="desktop-input-right">
                    <!-- Dynamic Input Loaded Here -->
                </div>
                <div class="menu-pill">
                    <svg class="pill-bg" viewBox="0 0 305 131" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect width="305" height="131" rx="65.5" fill="var(--btn-container)" />
                    </svg>
                    <svg class="menu-pill-inner" viewBox="0 0 231 67" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect width="231" height="67" rx="33.5" fill="var(--btn-color)" />
                    </svg>
                </div>
                <div class="kb-panel kb-desktop-right" id="kb-desktop-right"></div>
            </div>
        </div>

        <div class="mobile-layout" id="mobile">
            <div class="m-panel m-top">
                <div class="panel-bg-layer"></div>
                <div id="shared-mobile-screen-anchor"></div>
            </div>
            <div class="m-separator-wrap console-part">
                <div class="sep-group m-sep-group">
                    <div class="sep-rect m-sep-rect"></div>
                    <div class="sep-rect m-sep-rect"></div>
                    <div class="sep-rect m-sep-rect"></div>
                </div>
                <div class="m-separator"></div>
                <div class="sep-group m-sep-group">
                    <div class="sep-rect m-sep-rect"></div>
                    <div class="sep-rect m-sep-rect"></div>
                    <div class="sep-rect m-sep-rect"></div>
                </div>
            </div>
            <div class="m-panel console-part">
                <div class="side-panel-input side-panel-input-left" id="mobile-input-left"></div>
                <div class="side-panel-input side-panel-input-right" id="mobile-input-right"></div>
                <div class="m-menu-wrap">
                    <div class="menu-pill">
                        <svg class="pill-bg" viewBox="0 0 305 131" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect width="305" height="131" rx="65.5" fill="var(--btn-container)" />
                        </svg>
                        <svg class="menu-pill-inner" viewBox="0 0 231 67" fill="none"
                            xmlns="http://www.w3.org/2000/svg">
                            <rect width="231" height="67" rx="33.5" fill="var(--btn-color)" />
                        </svg>
                    </div>
                    <div class="menu-pill">
                        <svg class="pill-bg" viewBox="0 0 305 131" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect width="305" height="131" rx="65.5" fill="var(--btn-container)" />
                        </svg>
                        <svg class="menu-pill-inner" viewBox="0 0 231 67" fill="none"
                            xmlns="http://www.w3.org/2000/svg">
                            <rect width="231" height="67" rx="33.5" fill="var(--btn-color)" />
                        </svg>
                    </div>
                </div>
                <div class="m-speaker left">
                    <div class="dot p1"></div>
                    <div class="dot p2"></div>
                    <div class="dot p3"></div>
                    <div class="dot p4"></div>
                </div>
                <div class="m-speaker right">
                    <div class="dot p1"></div>
                    <div class="dot p2"></div>
                    <div class="dot p3"></div>
                    <div class="dot p4"></div>
                </div>
                <div class="kb-panel kb-mobile-full" id="kb-mobile-full"></div>
            </div>
        </div>
    </div>

    <script src="pocket-db.js"></script>
    <script src="main.js"></script>
    <script src="games/pong/index.js"></script>
    <script src="games/settings/index.js"></script>
    <script src="games/to-polish/chat/index.js"></script>
    <script src="games/notes/index.js"></script>
    <script src="games/to-polish/inputtest/index.js"></script>
    <script src="games/to-polish/notifier/index.js"></script>
    <script src="games/to-polish/pocketconnect/index.js"></script>
    <script src="games/calculator/index.js"></script>
    <script src="games/recorder/index.js"></script>
    <script src="games/clock/index.js"></script>
    <script src="games/2048/index.js"></script>
    <script src="games/to-polish/trucker/index.js"></script>
    <script src="games/library/index.js"></script>
    <script src="games/to-polish/golfer/engine.js"></script>
    <script src="games/to-polish/golfer/index.js"></script>
    <script src="games/to-polish/mario/index.js"></script>
    <script src="games/to-polish/mario/designer.js"></script>
    <script src="games/to-polish/blocks/index.js"></script>
    <script src="games/cuber/index.js"></script>
    <script src="games/to-polish/lockpick/index.js"></script>
    <script src="games/to-polish/cozytrain/index.js"></script>
    <script src="games/chess/index.js"></script>
    <script src="games/to-polish/feed/index.js"></script>
    <script src="games/to-polish/platformer/index.js"></script>
    <script src="games/to-polish/filemanager/index.js"></script>
    <script src="games/to-polish/tetris/index.js"></script>
    <script src="games/to-polish/terminal/index.js"></script>
    <script src="games/to-polish/snake/index.js"></script>
    <script src="games/to-polish/minesweeper/index.js"></script>
    <script src="games/flags/index.js"></script>
    <script src="games/math/index.js"></script>
    <script src="games/to-polish/draw/index.js"></script>
    <script src="games/memory/index.js"></script>
    <script src="games/social/index.js"></script>
</body>

</html>
