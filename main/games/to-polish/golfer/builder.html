<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Putt Putt Architect</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Jua&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #0d0d0f;
            --surface: #161618;
            --surface2: #1e1e21;
            --surface3: #26262a;
            --border: rgba(255, 255, 255, 0.08);
            --border2: rgba(255, 255, 255, 0.13);
            --text: #f0f0f2;
            --text2: #8e8e99;
            --accent: #7ed321;
            --accent2: #5aa818;
            --accent-glow: rgba(126, 211, 33, 0.25);
            --red: #ff453a;
            --blue: #0a84ff;
            --sidebar: 300px;
            --toolbar: 58px;
            --radius: 12px;
            --radius-sm: 8px;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.12);
            border-radius: 99px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.22);
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            font-family: 'Inter', system-ui, sans-serif;
            color: var(--text);
        }

        .shell {
            display: grid;
            grid-template-columns: var(--sidebar) 1fr var(--sidebar);
            grid-template-rows: var(--toolbar) 1fr;
            height: 100vh;
        }

        /* ── Toolbar ── */
        .toolbar {
            grid-column: 1 / -1;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 16px;
            backdrop-filter: blur(20px);
        }

        .toolbar-brand {
            font-family: 'Jua', sans-serif;
            font-size: 20px;
            color: var(--accent);
            width: var(--sidebar);
            flex-shrink: 0;
            letter-spacing: -0.5px;
        }

        .toolbar-center {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .toolbar-end {
            width: var(--sidebar);
            display: flex;
            justify-content: flex-end;
            gap: 6px;
            flex-shrink: 0;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--surface3);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 7px 14px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
            white-space: nowrap;
        }

        .btn:hover {
            background: var(--surface2);
            border-color: var(--border2);
        }

        .btn.primary {
            background: var(--accent);
            border-color: transparent;
            color: #000;
        }

        .btn.primary:hover {
            background: #8fe82a;
            box-shadow: 0 0 18px var(--accent-glow);
        }

        .btn.danger {
            background: var(--red);
            border-color: transparent;
            color: #fff;
        }

        .btn.danger:hover {
            opacity: 0.88;
        }

        .btn .icon {
            font-size: 14px;
        }

        .toolbar-sep {
            width: 1px;
            height: 24px;
            background: var(--border);
            margin: 0 4px;
        }

        /* ── Sidebars ── */
        .sidebar {
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar.right {
            border-right: none;
            border-left: 1px solid var(--border);
        }

        .sidebar-body {
            flex: 1;
            overflow-y: auto;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .section-label {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: var(--text2);
            padding: 10px 4px 6px;
        }

        /* ── Asset Grid ── */
        .asset-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        .asset-card {
            background: var(--surface2);
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 10px 8px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.15s;
            user-select: none;
        }

        .asset-card:hover {
            border-color: var(--border2);
            background: var(--surface3);
            transform: translateY(-1px);
        }

        .asset-card.selected {
            border-color: var(--accent);
            background: rgba(126, 211, 33, 0.07);
            box-shadow: 0 0 0 1px var(--accent);
        }

        .asset-card img {
            width: 48px;
            height: 48px;
            object-fit: contain;
            pointer-events: none;
        }

        .asset-card span {
            font-size: 10px;
            font-weight: 600;
            color: var(--text2);
            text-align: center;
            line-height: 1.3;
        }

        /* Tile buttons */
        .tile-row-btn {
            background: var(--surface2);
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
            color: var(--text);
            font-size: 13px;
            font-weight: 500;
            width: 100%;
        }

        .tile-row-btn:hover {
            border-color: var(--border2);
            background: var(--surface3);
        }

        .tile-row-btn .tile-icon {
            font-size: 20px;
        }

        .tile-row-btn .tile-badge {
            margin-left: auto;
            background: var(--surface3);
            border: 1px solid var(--border);
            width: 22px;
            height: 22px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            color: var(--accent);
        }

        /* ── Inspector ── */
        .insp-group {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            margin-bottom: 4px;
        }

        .insp-row {
            display: flex;
            align-items: center;
            padding: 10px 14px;
            gap: 10px;
            border-bottom: 1px solid var(--border);
            min-height: 42px;
        }

        .insp-row:last-child {
            border-bottom: none;
        }

        .insp-label {
            flex: 1;
            font-size: 13px;
            font-weight: 500;
            color: var(--text2);
        }

        .insp-input {
            background: transparent;
            border: none;
            color: var(--accent);
            font-size: 13px;
            font-weight: 700;
            text-align: right;
            width: 80px;
            font-family: inherit;
            outline: none;
        }

        .insp-select {
            background: transparent;
            border: none;
            color: var(--accent);
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            outline: none;
            appearance: none;
        }

        .insp-title {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--text2);
            padding: 12px 4px 4px;
        }

        .del-btn {
            background: var(--red);
            border: none;
            color: #fff;
            width: 100%;
            padding: 12px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.15s;
            font-family: inherit;
            margin-top: 6px;
        }

        .del-btn:hover {
            opacity: 0.85;
        }

        /* ── Viewport ── */
        .viewport {
            position: relative;
            background: #111;
            overflow: hidden;
        }

        #canvas {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
        }

        .zoom-badge {
            position: absolute;
            top: 14px;
            right: 14px;
            background: rgba(0, 0, 0, 0.55);
            color: #fff;
            padding: 5px 11px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            pointer-events: none;
        }

        .hints-bar {
            position: absolute;
            bottom: 18px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.5);
            color: rgba(255, 255, 255, 0.7);
            padding: 8px 20px;
            border-radius: 99px;
            font-size: 11px;
            font-weight: 500;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            pointer-events: none;
            white-space: nowrap;
        }

        .hints-bar b {
            color: var(--accent);
        }

        /* Layer indicator */
        .layer-badge {
            position: absolute;
            top: 14px;
            left: 14px;
            background: rgba(0, 0, 0, 0.55);
            color: #fff;
            padding: 5px 11px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .layer-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
        }

        /* Clipboard toast */
        .toast {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--surface2);
            color: var(--text);
            padding: 8px 18px;
            border-radius: 99px;
            font-size: 12px;
            font-weight: 600;
            pointer-events: none;
            border: 1px solid var(--border2);
            opacity: 0;
            transition: all 0.3s;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>

<body>
    <div class="shell">
        <header class="toolbar">
            <div class="toolbar-brand">⛳ Putt Putt Architect</div>
            <div class="toolbar-center">
                <button class="btn" onclick="newMap()"><span class="icon">✦</span> New</button>
                <button class="btn" onclick="importMap()"><span class="icon">↑</span> Import</button>
                <div class="toolbar-sep"></div>
                <button class="btn primary" onclick="exportMap()"><span class="icon">↓</span> Export JSON</button>
            </div>
            <div class="toolbar-end">
                <button class="btn primary" onclick="testPlay()">▶ Preview</button>
            </div>
        </header>

        <aside class="sidebar">
            <div class="sidebar-body">
                <div class="section-label">Tiles</div>
                <button class="tile-row-btn" onclick="addTile('grass')">
                    <span class="tile-icon">🟩</span> Green Grass<span class="tile-badge">+</span>
                </button>
                <button class="tile-row-btn" onclick="addTile('water')">
                    <span class="tile-icon">🟦</span> Water Tile<span class="tile-badge">+</span>
                </button>
                <button class="tile-row-btn" onclick="addTile('rough')">
                    <span class="tile-icon">🟫</span> Rough<span class="tile-badge">+</span>
                </button>
                <div class="section-label">Assets</div>
                <div class="asset-grid" id="asset-grid"></div>
            </div>
        </aside>

        <main class="viewport">
            <canvas id="canvas"></canvas>
            <div class="zoom-badge" id="zoom-info">100%</div>
            <div class="layer-badge" id="layer-info"><span class="layer-dot"></span><span id="layer-text">No
                    selection</span></div>
            <div class="hints-bar"><b>Pinch/Scroll</b> Pan • <b>Ctrl+Scroll</b> Zoom • <b>Alt+Drag</b> Clone •
                <b>Ctrl+C/V</b> Copy • <b>Del</b> Delete
            </div>
            <div class="toast" id="toast"></div>
        </main>

        <aside class="sidebar right">
            <div class="sidebar-body" id="inspector"></div>
        </aside>
    </div>

    <script>
        const ASSETS = [
            { id: 'log-1', name: 'Log Small', file: 'assets/log-1.svg' },
            { id: 'log-2', name: 'Log Large', file: 'assets/log-2.svg' },
            { id: 'sand-1', name: 'Sand Pit', file: 'assets/sand-1.svg' },
            { id: 'sand-2', name: 'Sand Wide', file: 'assets/sand-2.svg' },
            { id: 'sand-3', name: 'Sand Round', file: 'assets/sand-3.svg' },
            { id: 'water-1', name: 'Water 1', file: 'assets/water-1.svg' },
            { id: 'water-2', name: 'Water 2', file: 'assets/water-2.svg' },
            { id: 'water-3', name: 'Water 3', file: 'assets/water-3.svg' },
            { id: 'water-4', name: 'Water 4', file: 'assets/water-4.svg' },
            { id: 'water-5', name: 'Water 5', file: 'assets/water-5.svg' },
        ];

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let W = 0, H = 0;

        let state = {
            level: {
                par: 3, gridUnit: 60,
                start: { x: 1, y: 1 }, hole: { x: 4, y: 1 },
                tiles: [{ x: 0, y: 0, w: 6, h: 3, type: 'grass', z: 0 }],
                objects: [], boundaryMode: 'bounce'
            },
            camera: { x: -100, y: -100, zoom: 1 },
            selection: null,
            isDragging: false, dragMode: null,
            dragStart: { x: 0, y: 0 }, initialObj: null,
            keys: {}, imageDB: {},
            clipboard: null,
            selectedAsset: null, // currently highlighted asset card
        };

        // ─── Asset loading ─────────────────────────────────────
        function loadAssets() {
            ASSETS.forEach(a => {
                const img = new Image(); img.src = a.file;
                state.imageDB[a.file] = img;
                img.onload = draw;
            });
        }

        // ─── Coordinate transforms ──────────────────────────────
        function toWorld(sx, sy) {
            const r = canvas.getBoundingClientRect();
            return { x: (sx - r.left) / state.camera.zoom + state.camera.x, y: (sy - r.top) / state.camera.zoom + state.camera.y };
        }

        // ─── Toast ──────────────────────────────────────────────
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg; t.classList.add('show');
            clearTimeout(t._tid);
            t._tid = setTimeout(() => t.classList.remove('show'), 1800);
        }

        // ─── Shadow helper ──────────────────────────────────────
        // Returns the z-layer directly below a given z, or null if z is 0
        function getLayerBelow(z) {
            const allZ = [...new Set([
                ...state.level.tiles.map(t => t.z || 0),
                ...state.level.objects.map(o => o.z || 0)
            ])].sort((a, b) => a - b);
            const idx = allZ.indexOf(z);
            return idx > 0 ? allZ[idx - 1] : null;
        }

        // Draws a soft shadow for a rect at a given world position onto the canvas
        // Only drawn if the layer BELOW the object is NOT the direct next layer
        function drawShadowIfNeeded(worldX, worldY, worldW, worldH, angle, objZ) {
            const directBelow = getLayerBelow(objZ);
            const allZ = [...new Set([
                ...state.level.tiles.map(t => t.z || 0),
                ...state.level.objects.map(o => o.z || 0)
            ])].sort((a, b) => a - b);

            // Find the highest z that is LESS than objZ (i.e. what's underneath in world)
            let shadowTargetZ = null;
            for (const z of allZ) { if (z < objZ) shadowTargetZ = z; }

            // Only cast shadow if the target is NOT the direct layer below
            // (i.e. there's a gap — we skip directly adjacent layers)
            if (shadowTargetZ === null) return; // nothing below
            if (shadowTargetZ === directBelow) return; // directly adjacent — no shadow

            // Cast shadow
            ctx.save();
            ctx.translate(worldX + worldW / 2 + 12, worldY + worldH / 2 + 12);
            ctx.rotate(angle || 0);
            ctx.fillStyle = 'rgba(0,0,0,0.22)';
            ctx.filter = 'blur(8px)';
            ctx.fillRect(-worldW / 2, -worldH / 2, worldW, worldH);
            ctx.filter = 'none';
            ctx.restore();
        }

        // ─── Draw ───────────────────────────────────────────────
        function draw() {
            ctx.clearRect(0, 0, W, H);
            ctx.fillStyle = '#111'; ctx.fillRect(0, 0, W, H);

            ctx.save();
            ctx.translate(-state.camera.x * state.camera.zoom, -state.camera.y * state.camera.zoom);
            ctx.scale(state.camera.zoom, state.camera.zoom);

            const g = state.level.gridUnit;
            const allZ = [...new Set([
                ...state.level.tiles.map(t => t.z || 0),
                ...state.level.objects.map(o => o.z || 0)
            ])].sort((a, b) => a - b);

            allZ.forEach(z => {
                const directBelow = getLayerBelow(z);

                // ── Tiles ──
                state.level.tiles.forEach(t => {
                    if ((t.z || 0) !== z) return;
                    const tx = t.x * g, ty = t.y * g, tw = t.w * g, th = t.h * g;

                    // Shadow for elevated tiles (only if gap > 1 layer)
                    if (z > 0 && directBelow !== null) {
                        const layerBelowBelow = getLayerBelow(directBelow);
                        // Shadow if more than 1 layer above the bottom-most, or skip direct
                        if (directBelow !== 0 || z > 1) {
                            ctx.save();
                            ctx.fillStyle = 'rgba(0,0,0,0.18)';
                            ctx.filter = 'blur(10px)';
                            ctx.fillRect(tx + 16, ty + th + 4, tw, 20);
                            ctx.filter = 'none';
                            ctx.restore();
                        }
                        // Always draw the step edge
                        ctx.fillStyle = 'rgba(0,0,0,0.2)';
                        ctx.fillRect(tx, ty + th, tw, 10);
                    }

                    if (t.type === 'water') {
                        ctx.fillStyle = '#4faec4'; ctx.fillRect(tx, ty, tw, th);
                        ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.lineWidth = 1.5;
                        for (let wx = tx + 10; wx < tx + tw; wx += 30) {
                            ctx.beginPath(); ctx.moveTo(wx, ty + 10); ctx.lineTo(wx + 12, ty + 10); ctx.stroke();
                        }
                    } else if (t.type === 'rough') {
                        for (let lx = 0; lx < tw; lx += g) {
                            for (let ly = 0; ly < th; ly += g) {
                                const isDark = (Math.floor((tx + lx) / g) + Math.floor((ty + ly) / g)) % 2 !== 0;
                                ctx.fillStyle = isDark ? '#3a7a0d' : '#458c10';
                                ctx.fillRect(tx + lx, ty + ly, g + 0.5, g + 0.5);
                            }
                        }
                    } else {
                        for (let lx = 0; lx < tw; lx += g) {
                            for (let ly = 0; ly < th; ly += g) {
                                const isDark = (Math.floor((tx + lx) / g) + Math.floor((ty + ly) / g)) % 2 !== 0;
                                ctx.fillStyle = isDark ? '#6DBE1D' : '#79C51C';
                                ctx.fillRect(tx + lx, ty + ly, g + 0.5, g + 0.5);
                            }
                        }
                    }
                });

                // ── Objects shadows pass ──
                state.level.objects.forEach(o => {
                    if ((o.z || 0) !== z) return;
                    drawShadowIfNeeded(o.x, o.y, o.w, o.h, o.angle || 0, z);
                });

                // ── Objects draw pass ──
                state.level.objects.forEach(o => {
                    if ((o.z || 0) !== z) return;
                    const img = state.imageDB[o.sprite];
                    ctx.save();
                    ctx.translate(o.x + o.w / 2 + (o._dx || 0), o.y + o.h / 2 + (o._dy || 0));
                    ctx.rotate(o.angle || 0);
                    if (img && img.complete && img.naturalWidth > 0) ctx.drawImage(img, -o.w / 2, -o.h / 2, o.w, o.h);
                    else { ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.fillRect(-o.w / 2, -o.h / 2, o.w, o.h); }
                    ctx.restore();
                });
            });

            // ── Special points ──
            // Start
            ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.beginPath(); ctx.arc(state.level.start.x * g + g / 2 + 2, state.level.start.y * g + g / 2 + 3, 9, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(state.level.start.x * g + g / 2, state.level.start.y * g + g / 2, 9, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#c0d8a0'; ctx.beginPath(); ctx.arc(state.level.start.x * g + g / 2 - 3, state.level.start.y * g + g / 2 - 3, 3, 0, Math.PI * 2); ctx.fill();
            // Hole
            ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.arc(state.level.hole.x * g + g / 2 + 2, state.level.hole.y * g + g / 2 + 3, 15, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(state.level.hole.x * g + g / 2, state.level.hole.y * g + g / 2, 14, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.lineWidth = 1.5; ctx.stroke();

            // ── Selection outline ──
            if (state.selection) {
                let bx, by, bw, bh, ang = 0;
                if (state.selection === 'start') { bx = state.level.start.x * g; by = state.level.start.y * g; bw = g; bh = g; }
                else if (state.selection === 'hole') { bx = state.level.hole.x * g; by = state.level.hole.y * g; bw = g; bh = g; }
                else if (state.selection.type === 'tile') { bx = state.selection.data.x * g; by = state.selection.data.y * g; bw = state.selection.data.w * g; bh = state.selection.data.h * g; }
                else { bx = state.selection.x; by = state.selection.y; bw = state.selection.w; bh = state.selection.h; ang = state.selection.angle || 0; }
                ctx.save();
                ctx.translate(bx + bw / 2, by + bh / 2); ctx.rotate(ang);
                ctx.strokeStyle = 'rgba(126,211,33,0.9)'; ctx.lineWidth = 2 / state.camera.zoom;
                ctx.setLineDash([6 / state.camera.zoom, 3 / state.camera.zoom]);
                ctx.strokeRect(-bw / 2, -bh / 2, bw, bh);
                ctx.setLineDash([]);
                const hs = 8 / state.camera.zoom;
                [[-bw / 2, -bh / 2], [bw / 2, -bh / 2], [-bw / 2, bh / 2], [bw / 2, bh / 2]].forEach(([px, py]) => {
                    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#7ed321'; ctx.lineWidth = 1.5 / state.camera.zoom;
                    ctx.fillRect(px - hs / 2, py - hs / 2, hs, hs);
                    ctx.strokeRect(px - hs / 2, py - hs / 2, hs, hs);
                });
                // Rotate handle
                if (state.selection.sprite) {
                    ctx.beginPath(); ctx.arc(0, -bh / 2 - 24 / state.camera.zoom, 6 / state.camera.zoom, 0, Math.PI * 2);
                    ctx.fillStyle = '#7ed321'; ctx.fill();
                    ctx.strokeStyle = 'rgba(126,211,33,0.5)'; ctx.lineWidth = 1 / state.camera.zoom;
                    ctx.beginPath(); ctx.moveTo(0, -bh / 2); ctx.lineTo(0, -bh / 2 - 18 / state.camera.zoom); ctx.stroke();
                }
                ctx.restore();
            }

            ctx.restore();
            updateLayerBadge();
        }

        function updateLayerBadge() {
            const el = document.getElementById('layer-text');
            if (!state.selection) { el.textContent = 'No selection'; return; }
            let z = 0;
            if (state.selection.type === 'tile') z = state.selection.data.z || 0;
            else if (state.selection.sprite) z = state.selection.z || 0;
            el.textContent = `Layer ${z}`;
        }

        // ─── Hit testing ────────────────────────────────────────
        function getHit(wp) {
            const g = state.level.gridUnit;
            const obj = [...state.level.objects].reverse().find(o => {
                const dx = wp.x - (o.x + o.w / 2), dy = wp.y - (o.y + o.h / 2);
                const cos = Math.cos(-(o.angle || 0)), sin = Math.sin(-(o.angle || 0));
                return Math.abs(dx * cos - dy * sin) <= o.w / 2 && Math.abs(dx * sin + dy * cos) <= o.h / 2;
            });
            if (obj) return obj;
            if (Math.floor(wp.x / g) === state.level.start.x && Math.floor(wp.y / g) === state.level.start.y) return 'start';
            if (Math.floor(wp.x / g) === state.level.hole.x && Math.floor(wp.y / g) === state.level.hole.y) return 'hole';
            const tile = state.level.tiles.find(t => wp.x >= t.x * g && wp.x <= (t.x + t.w) * g && wp.y >= t.y * g && wp.y <= (t.y + t.h) * g);
            return tile ? { type: 'tile', data: tile } : null;
        }

        function getHandle(wp, bx, by, bw, bh, ang, isSprite) {
            const cx = bx + bw / 2, cy = by + bh / 2, dx = wp.x - cx, dy = wp.y - cy;
            const cos = Math.cos(-ang), sin = Math.sin(-ang);
            const lx = dx * cos - dy * sin, ly = dx * sin + dy * cos;
            const t = 15 / state.camera.zoom;
            if (isSprite && Math.abs(lx) < t && Math.abs(ly + bh / 2 + 24 / state.camera.zoom) < t) return 'rotate';
            if (Math.abs(lx - bw / 2) < t && Math.abs(ly - bh / 2) < t) return 'br';
            if (Math.abs(lx + bw / 2) < t && Math.abs(ly + bh / 2) < t) return 'tl';
            if (Math.abs(lx - bw / 2) < t && Math.abs(ly + bh / 2) < t) return 'tr';
            if (Math.abs(lx + bw / 2) < t && Math.abs(ly - bh / 2) < t) return 'bl';
            return null;
        }

        // ─── Mouse / Pointer events ─────────────────────────────
        canvas.addEventListener('pointerdown', e => {
            canvas.setPointerCapture(e.pointerId);
            const wp = toWorld(e.clientX, e.clientY);
            if (state.keys['Space'] || e.button === 1) {
                state.dragMode = 'pan'; state.dragStart = { x: e.clientX, y: e.clientY }; state.isDragging = true; return;
            }
            if (state.selection) {
                const g = state.level.gridUnit; let bx, by, bw, bh, ang = 0;
                if (state.selection === 'start') { bx = state.level.start.x * g; by = state.level.start.y * g; bw = g; bh = g; }
                else if (state.selection === 'hole') { bx = state.level.hole.x * g; by = state.level.hole.y * g; bw = g; bh = g; }
                else if (state.selection.type === 'tile') { bx = state.selection.data.x * g; by = state.selection.data.y * g; bw = state.selection.data.w * g; bh = state.selection.data.h * g; }
                else { bx = state.selection.x; by = state.selection.y; bw = state.selection.w; bh = state.selection.h; ang = state.selection.angle || 0; }
                const h = getHandle(wp, bx, by, bw, bh, ang, !!state.selection.sprite);
                if (h) {
                    state.dragMode = h; state.dragStart = { ...wp };
                    state.initialObj = state.selection.type === 'tile' ? { ...state.selection.data } : typeof state.selection === 'string' ? { ...state.level[state.selection] } : { ...state.selection };
                    state.isDragging = true; return;
                }
            }
            const hit = getHit(wp);
            if (hit) {
                if (e.altKey && hit.type === 'tile') { const c = { ...hit.data }; state.level.tiles.push(c); state.selection = { type: 'tile', data: c }; }
                else if (e.altKey && hit.sprite) { const c = { ...hit }; state.level.objects.push(c); state.selection = c; }
                else state.selection = hit;
                state.dragMode = 'move'; state.dragStart = { ...wp };
                state.initialObj = state.selection.type === 'tile' ? { ...state.selection.data } : typeof state.selection === 'string' ? { ...state.level[state.selection] } : { ...state.selection };
                state.isDragging = true;
            } else { state.selection = null; }
            updateInspector(); draw();
        });

        window.addEventListener('pointermove', e => {
            if (!state.isDragging) return;
            const wp = toWorld(e.clientX, e.clientY);
            const g = state.level.gridUnit;
            if (state.dragMode === 'pan') {
                state.camera.x -= (e.clientX - state.dragStart.x) / state.camera.zoom;
                state.camera.y -= (e.clientY - state.dragStart.y) / state.camera.zoom;
                state.dragStart = { x: e.clientX, y: e.clientY };
            } else if (state.dragMode === 'move') {
                const target = state.selection.type === 'tile' ? state.selection.data : (typeof state.selection === 'string' ? state.level[state.selection] : state.selection);
                const dx = wp.x - state.dragStart.x, dy = wp.y - state.dragStart.y;
                if (state.selection.type === 'tile' || typeof state.selection === 'string') {
                    target.x = state.initialObj.x + Math.round(dx / g); target.y = state.initialObj.y + Math.round(dy / g);
                } else {
                    target.x = Math.round((state.initialObj.x + dx) / (g / 4)) * (g / 4);
                    target.y = Math.round((state.initialObj.y + dy) / (g / 4)) * (g / 4);
                }
            } else if (state.dragMode === 'rotate') {
                const cx = state.initialObj.x + state.initialObj.w / 2, cy = state.initialObj.y + state.initialObj.h / 2;
                state.selection.angle = Math.atan2(wp.y - cy, wp.x - cx) + Math.PI / 2;
            } else if (['tl', 'tr', 'bl', 'br'].includes(state.dragMode)) {
                const target = state.selection.type === 'tile' ? state.selection.data : state.selection;
                const dx = wp.x - state.dragStart.x, dy = wp.y - state.dragStart.y;
                if (state.selection.type === 'tile') {
                    const dwX = Math.round(dx / g), dwY = Math.round(dy / g);
                    if (state.dragMode === 'br') { target.w = Math.max(1, state.initialObj.w + dwX); target.h = Math.max(1, state.initialObj.h + dwY); }
                    else if (state.dragMode === 'tl') { if (state.initialObj.w - dwX >= 1) { target.x = state.initialObj.x + dwX; target.w = state.initialObj.w - dwX; } if (state.initialObj.h - dwY >= 1) { target.y = state.initialObj.y + dwY; target.h = state.initialObj.h - dwY; } }
                } else if (state.selection.sprite) {
                    let ldx = dx * Math.cos(-(target.angle || 0)) - dy * Math.sin(-(target.angle || 0));
                    let ldy = dx * Math.sin(-(target.angle || 0)) + dy * Math.cos(-(target.angle || 0));
                    if (state.dragMode === 'br') { target.w = Math.max(5, state.initialObj.w + ldx); target.h = Math.max(5, state.initialObj.h + ldy); }
                }
            }
            updateInspectorValues(); draw();
        });

        window.addEventListener('pointerup', () => { state.isDragging = false; });

        // ─── Wheel / Scroll ─────────────────────────────────────
        // Supports: Ctrl+wheel = zoom | pinch (ctrlKey auto set by browser) = zoom | plain scroll = pan
        window.addEventListener('wheel', e => {
            e.preventDefault();
            if (e.ctrlKey) {
                // Zoom
                const delta = e.deltaY > 0 ? 0.92 : 1.09;
                const r = canvas.getBoundingClientRect();
                const wx = (e.clientX - r.left) / state.camera.zoom + state.camera.x;
                const wy = (e.clientY - r.top) / state.camera.zoom + state.camera.y;
                state.camera.zoom = Math.min(4, Math.max(0.2, state.camera.zoom * delta));
                state.camera.x = wx - (e.clientX - r.left) / state.camera.zoom;
                state.camera.y = wy - (e.clientY - r.top) / state.camera.zoom;
                document.getElementById('zoom-info').textContent = Math.round(state.camera.zoom * 100) + '%';
            } else {
                // Pan (plain scroll or two-finger swipe WITHOUT pinch)
                state.camera.x += e.deltaX / state.camera.zoom;
                state.camera.y += e.deltaY / state.camera.zoom;
            }
            draw();
        }, { passive: false });

        // ─── Keyboard ───────────────────────────────────────────
        window.addEventListener('keydown', e => {
            state.keys[e.code] = true;
            const active = document.activeElement.tagName;
            if (['INPUT', 'SELECT', 'TEXTAREA'].includes(active)) return;

            if (e.key === 'Delete' || e.key === 'Backspace') { deleteSel(); return; }

            if (e.ctrlKey || e.metaKey) {
                if (e.key === 'c') { copySelection(); return; }
                if (e.key === 'v') { pasteSelection(); return; }
            }
        });
        window.addEventListener('keyup', e => { state.keys[e.code] = false; });

        function copySelection() {
            if (!state.selection) return;
            if (state.selection.type === 'tile') {
                state.clipboard = { kind: 'tile', data: { ...state.selection.data } };
                showToast('Tile copied');
            } else if (state.selection.sprite) {
                state.clipboard = { kind: 'object', data: { ...state.selection } };
                showToast('Object copied');
            }
        }

        function pasteSelection() {
            if (!state.clipboard) return;
            const g = state.level.gridUnit;
            if (state.clipboard.kind === 'tile') {
                const c = { ...state.clipboard.data, x: state.clipboard.data.x + 1, y: state.clipboard.data.y + 1 };
                state.level.tiles.push(c);
                state.selection = { type: 'tile', data: c };
                showToast('Tile pasted');
            } else if (state.clipboard.kind === 'object') {
                const c = { ...state.clipboard.data, x: state.clipboard.data.x + g / 2, y: state.clipboard.data.y + g / 2 };
                state.level.objects.push(c);
                state.selection = c;
                showToast('Object pasted');
            }
            updateInspector(); draw();
        }

        // ─── Inspector ──────────────────────────────────────────
        function updateInspector() {
            const el = document.getElementById('inspector');
            if (!state.selection) {
                el.innerHTML = `
<div class="insp-title">Map Settings</div>
<div class="insp-group">
  <div class="insp-row"><span class="insp-label">Grid Size</span><input type="number" class="insp-input" value="${state.level.gridUnit}" oninput="state.level.gridUnit=+this.value;draw()"></div>
  <div class="insp-row"><span class="insp-label">Par</span><input type="number" class="insp-input" value="${state.level.par}" oninput="state.level.par=+this.value"></div>
  <div class="insp-row"><span class="insp-label">Boundary</span>
    <select class="insp-select" id="i-bound">
      <option value="bounce" ${state.level.boundaryMode === 'bounce' ? 'selected' : ''}>Bounce</option>
      <option value="reset" ${state.level.boundaryMode === 'reset' ? 'selected' : ''}>Reset</option>
    </select>
  </div>
</div>`;
                document.getElementById('i-bound').onchange = e => { state.level.boundaryMode = e.target.value; draw(); };
                return;
            }
            if (state.selection.type === 'tile') {
                const t = state.selection.data;
                el.innerHTML = `
<div class="insp-title">Tile</div>
<div class="insp-group">
  <div class="insp-row"><span class="insp-label">Type</span>
    <select class="insp-select" id="i-ttype">
      <option value="grass" ${t.type === 'grass' ? 'selected' : ''}>Grass</option>
      <option value="rough" ${t.type === 'rough' ? 'selected' : ''}>Rough</option>
      <option value="water" ${t.type === 'water' ? 'selected' : ''}>Water</option>
    </select>
  </div>
  <div class="insp-row"><span class="insp-label">Layer (Z)</span><input type="number" id="i-tz" class="insp-input" value="${t.z || 0}"></div>
  <div class="insp-row"><span class="insp-label">X</span><input type="number" id="i-tx" class="insp-input" value="${t.x}"></div>
  <div class="insp-row"><span class="insp-label">Y</span><input type="number" id="i-ty" class="insp-input" value="${t.y}"></div>
  <div class="insp-row"><span class="insp-label">W</span><input type="number" id="i-tw" class="insp-input" value="${t.w}"></div>
  <div class="insp-row"><span class="insp-label">H</span><input type="number" id="i-th" class="insp-input" value="${t.h}"></div>
</div>
<button class="del-btn" onclick="deleteSel()">Delete Tile</button>`;
                document.getElementById('i-ttype').onchange = e => { t.type = e.target.value; draw(); };
                document.getElementById('i-tz').oninput = e => { t.z = parseInt(e.target.value) || 0; draw(); };
                document.getElementById('i-tx').oninput = e => { t.x = +e.target.value; draw(); };
                document.getElementById('i-ty').oninput = e => { t.y = +e.target.value; draw(); };
                document.getElementById('i-tw').oninput = e => { t.w = Math.max(1, +e.target.value); draw(); };
                document.getElementById('i-th').oninput = e => { t.h = Math.max(1, +e.target.value); draw(); };
                return;
            }
            if (state.selection.sprite) {
                const o = state.selection;
                el.innerHTML = `
<div class="insp-title">Object</div>
<div class="insp-group">
  <div class="insp-row"><span class="insp-label">Layer (Z)</span><input type="number" id="i-oz" class="insp-input" value="${o.z || 0}"></div>
  <div class="insp-row"><span class="insp-label">Angle °</span><input type="number" id="i-ang" class="insp-input" value="${Math.round((o.angle || 0) * 180 / Math.PI)}"></div>
  <div class="insp-row"><span class="insp-label">Width</span><input type="number" id="i-ow" class="insp-input" value="${Math.round(o.w)}"></div>
  <div class="insp-row"><span class="insp-label">Height</span><input type="number" id="i-oh" class="insp-input" value="${Math.round(o.h)}"></div>
  <div class="insp-row"><span class="insp-label">X</span><input type="number" id="i-ox" class="insp-input" value="${Math.round(o.x)}"></div>
  <div class="insp-row"><span class="insp-label">Y</span><input type="number" id="i-oy" class="insp-input" value="${Math.round(o.y)}"></div>
</div>
<button class="del-btn" onclick="deleteSel()">Remove Object</button>`;
                document.getElementById('i-oz').oninput = e => { o.z = parseInt(e.target.value) || 0; draw(); };
                document.getElementById('i-ang').oninput = e => { o.angle = parseFloat(e.target.value) * Math.PI / 180; draw(); };
                document.getElementById('i-ow').oninput = e => { o.w = Math.max(5, +e.target.value); draw(); };
                document.getElementById('i-oh').oninput = e => { o.h = Math.max(5, +e.target.value); draw(); };
                document.getElementById('i-ox').oninput = e => { o.x = +e.target.value; draw(); };
                document.getElementById('i-oy').oninput = e => { o.y = +e.target.value; draw(); };
            }
            if (state.selection === 'start' || state.selection === 'hole') {
                const key = state.selection, obj = state.level[key];
                el.innerHTML = `
<div class="insp-title">${key === 'start' ? 'Start Point' : 'Hole'}</div>
<div class="insp-group">
  <div class="insp-row"><span class="insp-label">X (grid)</span><input type="number" id="i-px" class="insp-input" value="${obj.x}"></div>
  <div class="insp-row"><span class="insp-label">Y (grid)</span><input type="number" id="i-py" class="insp-input" value="${obj.y}"></div>
</div>`;
                document.getElementById('i-px').oninput = e => { obj.x = +e.target.value; draw(); };
                document.getElementById('i-py').oninput = e => { obj.y = +e.target.value; draw(); };
            }
        }

        function updateInspectorValues() {
            if (!state.selection || !state.selection.sprite) return;
            const o = state.selection;
            if (document.getElementById('i-ang')) document.getElementById('i-ang').value = Math.round((o.angle || 0) * 180 / Math.PI);
            if (document.getElementById('i-ox')) document.getElementById('i-ox').value = Math.round(o.x);
            if (document.getElementById('i-oy')) document.getElementById('i-oy').value = Math.round(o.y);
            if (document.getElementById('i-ow')) document.getElementById('i-ow').value = Math.round(o.w);
            if (document.getElementById('i-oh')) document.getElementById('i-oh').value = Math.round(o.h);
        }

        // ─── Public actions ─────────────────────────────────────
        window.addTile = type => {
            const g = state.level.gridUnit;
            const t = { x: Math.round(state.camera.x / g), y: Math.round(state.camera.y / g), w: 4, h: 4, type, z: 0 };
            state.level.tiles.push(t);
            state.selection = { type: 'tile', data: t };
            updateInspector(); draw();
        };

        window.deleteSel = () => {
            if (!state.selection) return;
            if (state.selection.type === 'tile') state.level.tiles = state.level.tiles.filter(t => t !== state.selection.data);
            else if (state.selection.sprite) state.level.objects = state.level.objects.filter(o => o !== state.selection);
            state.selection = null; updateInspector(); draw();
        };

        window.newMap = () => {
            if (!confirm('Clear the current map?')) return;
            state.level = { par: 3, gridUnit: 60, start: { x: 1, y: 1 }, hole: { x: 4, y: 1 }, tiles: [{ x: 0, y: 0, w: 6, h: 3, type: 'grass', z: 0 }], objects: [], boundaryMode: 'bounce' };
            state.selection = null; updateInspector(); draw();
        };

        window.exportMap = () => {
            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([JSON.stringify(state.level, null, 2)], { type: 'application/json' }));
            a.download = 'level.json'; a.click();
        };

        window.importMap = () => {
            const i = document.createElement('input'); i.type = 'file'; i.accept = '.json';
            i.onchange = e => {
                const r = new FileReader();
                r.onload = ev => { state.level = JSON.parse(ev.target.result); state.selection = null; updateInspector(); draw(); };
                r.readAsText(e.target.files[0]);
            };
            i.click();
        };

        window.testPlay = () => {
            const d = JSON.parse(JSON.stringify(state.level));
            if (window.parent && window.parent.launchApp) window.parent.launchApp('golfer', d);
        };

        // ─── Init ───────────────────────────────────────────────
        window.addEventListener('load', () => {
            const resize = () => { W = canvas.offsetWidth; H = canvas.offsetHeight; canvas.width = W; canvas.height = H; draw(); };
            window.addEventListener('resize', resize); resize();
            loadAssets(); updateInspector();

            // Build asset grid
            const grid = document.getElementById('asset-grid');
            ASSETS.forEach(a => {
                const card = document.createElement('div');
                card.className = 'asset-card';
                card.dataset.id = a.id;
                card.innerHTML = `<img src="${a.file}" loading="lazy"><span>${a.name}</span>`;
                card.onclick = () => {
                    // Toggle selection
                    const wasSelected = state.selectedAsset === a.id;
                    document.querySelectorAll('.asset-card').forEach(c => c.classList.remove('selected'));
                    if (wasSelected) { state.selectedAsset = null; return; }
                    card.classList.add('selected');
                    state.selectedAsset = a.id;

                    // Place object into canvas
                    const g = state.level.gridUnit;
                    const o = {
                        sprite: a.file,
                        x: state.camera.x + (W / state.camera.zoom) / 2 - 60,
                        y: state.camera.y + (H / state.camera.zoom) / 2 - 60,
                        w: 120, h: 120, angle: 0, z: 0
                    };
                    state.level.objects.push(o);
                    state.selection = o;
                    updateInspector(); draw();
                };
                grid.appendChild(card);
            });
        });
    </script>
</body>

</html>
